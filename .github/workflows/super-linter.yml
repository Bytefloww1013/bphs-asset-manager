name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # No paths-ignore: a check that never starts would block a required-check PR forever.
  # Super-Linter skips the same files through FILTER_REGEX_EXCLUDE below.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app runs on Node 24 (package.json "engines", Dockerfile); Bun is only the package manager.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # reads "packageManager": "bun@1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Turn these on once ESLint and Prettier are set up (see below).
      # - name: Lint
      #   run: bun run lint
      # - name: Check formatting
      #   run: bun run format:check

  lint:
    name: Super-Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      # pull-requests and issues: the summary comment on the PR. statuses: the per-linter checks.
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Super-Linter compares against main to find changed files
          persist-credentials: false

      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: "main"
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' }}
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true
          # Only these linters run. TypeScript is left to the test job's ESLint and Prettier.
          VALIDATE_GITLEAKS: true # leaked secrets
          VALIDATE_DOCKERFILE_HADOLINT: true # Dockerfile
          VALIDATE_BASH: true # shellcheck on scripts/ and docs/verify/
          VALIDATE_GITHUB_ACTIONS: true # actionlint on this file
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true # security audit of workflows
          VALIDATE_YAML: true # docker-compose.yml, workflows
          # Skip tool folders, brand files, docs, dotfiles and Markdown
          FILTER_REGEX_EXCLUDE: "(^|/)(\\.impeccable|\\.rtk|brand-assets|docs)/.*|(^|/)(\\.dockerignore|\\.env\\.example|\\.gitignore)$|.*\\.md$"
