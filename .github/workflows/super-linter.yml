name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # Run by hand on any branch (Actions tab or `gh workflow run CI --ref <branch>`), e.g. to try CI before opening a PR.
  workflow_dispatch:
  # No paths-ignore: a check that never starts would block a required-check PR forever.
  # Super-Linter skips the same files through FILTER_REGEX_EXCLUDE below.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app runs on Node 24 (package.json "engines", Dockerfile); Bun is only the package manager.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # reads "packageManager": "bun@1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Oxfmt; first because it is the fastest check.
      - name: Check formatting
        run: bun run format:check

      # The generated module registries must match app.modules.ts and the manifests; it also checks the dependency graph.
      - name: Module registries
        run: bun run modules:gen --check

      # Stale docs: a module README without its required sections, the module table in docs/architecture.md out of date,
      # or a repo path quoted in a Markdown doc that no longer exists.
      - name: Docs
        run: bun run docs:check

      # Oxlint, type-aware; --format github turns each finding into an annotation on the PR.
      - name: Lint
        run: bun run lint --format github

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The route smoke (issue #23): every route of the app, opened as two users in headless Chrome on a seeded scratch server.
      # --no: the locked @puppeteer/browsers that puppeteer-core brings, never a fresh download of the tool.
      - name: Install Chrome
        id: chrome
        run: echo "path=$(npx --no @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/browsers" --format '{{path}}')" >>"$GITHUB_OUTPUT"

      - name: Route smoke
        run: node docs/verify/routes-smoke.mjs
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          ROOT: ${{ runner.temp }}/bphs-routes-smoke
          SKIP_BUILD: 1 # built by the step above

  lint:
    name: Super-Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      # pull-requests and issues: the summary comment on the PR. statuses: the per-linter checks.
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Super-Linter compares against main to find changed files
          persist-credentials: false

      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: 'main'
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' }}
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true
          # Only these linters run. TypeScript is left to the test job (Oxfmt and Oxlint; Super-Linter doesn't bundle them).
          VALIDATE_GITLEAKS: true # leaked secrets
          VALIDATE_DOCKERFILE_HADOLINT: true # Dockerfile
          VALIDATE_BASH: true # shellcheck on scripts/ and docs/verify/
          VALIDATE_GITHUB_ACTIONS: true # actionlint on this file
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true # security audit of workflows
          VALIDATE_YAML: true # docker-compose.yml, workflows
          # Skip tool folders, brand files, docs, dotfiles and Markdown
          FILTER_REGEX_EXCLUDE: "(^|/)(\\.impeccable|\\.rtk|brand-assets|docs)/.*|(^|/)(\\.dockerignore|\\.env\\.example|\\.gitignore)$|.*\\.md$"
